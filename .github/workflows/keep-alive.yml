name: Keep Server Awake

on:
  schedule:
    - cron: '*/10 * * * *' # Runs every 10 minutes
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Live Site URL
        run: |
          URL="https://utkarshbuilds.in"
          echo "Pinging $URL..."
          HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 --max-time 20 "$URL")
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::warning::Server returned status $HTTP_STATUS"
          else
            echo "Server is healthy and awake!"
          fi
